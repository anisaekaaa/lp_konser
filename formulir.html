<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pilih Kursi Konser</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h1 {
      background-color: #003366;
      color: white;
      padding: 20px 0;
      margin: 0;
    }

    .legend {
      margin: 20px;
    }

    .legend span {
      display: inline-block;
      width: 20px;
      height: 20px;
      margin-right: 8px;
      vertical-align: middle;
    }

    .reguler { background-color: #90ee90; }
    .vip { background-color: #fdd835; }
    .vvip { background-color: #ff8a80; }
    .taken { background-color: #555 !important; cursor: not-allowed; opacity: 0.6; }

    .stage {
      background-color: #222;
      color: white;
      padding: 10px;
      margin: 20px auto;
      width: 80%;
      font-weight: bold;
      border-radius: 5px;
    }

    .seat-map {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      margin-bottom: 30px;
    }

    .row {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .seat {
      width: 30px;
      height: 30px;
      border: 1px solid #ccc;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
    }

    .seat:checked {
      outline: 2px solid #000;
    }

    .seat.reguler { background-color: #90ee90; }
    .seat.vip { background-color: #fdd835; }
    .seat.vvip { background-color: #ff8a80; }

    .space {
      width: 60px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 30px;
      background-color: #388dff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0069f4;
    }

    .back-link {
      display: inline-block;
      padding: 10px 20px;
      margin-top: 15px;
      background-color: #ccc;
      color: black;
      text-decoration: none;
      border-radius: 5px;
    }

    .back-link:hover {
      background-color: #999;
    }
  </style>
</head>
